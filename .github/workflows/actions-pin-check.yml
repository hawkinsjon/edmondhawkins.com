name: actions-pin-check
on:
  pull_request:
    paths: ['.github/workflows/**', '.github/actions/**']
  push:
    branches: [main]
    paths: ['.github/workflows/**', '.github/actions/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: All actions must be pinned to a commit SHA
        run: |
          set -eu
          bad=0
          while IFS= read -r line; do
            ref=$(printf '%s' "$line" | sed -E 's/^.*uses:[[:space:]]*["'"'"']?([^"'"'"' #]+).*$/\1/')
            case "$ref" in
              ./*|docker://*) continue ;;
            esac
            if ! printf '%s' "$ref" | grep -Eq '@[0-9a-f]{40}$'; then
              echo "::error::unpinned action: $ref ($line)"
              bad=1
            fi
          done < <(grep -rhoE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*.+' .github/)
          [ "$bad" -eq 0 ] || exit 1
          echo "all actions are SHA-pinned"
