name: actions-pin-check
on:
  pull_request:
    paths: ['.github/workflows/**', '.github/actions/**']
  push:
    branches: [main]
    paths: ['.github/workflows/**', '.github/actions/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Third-party actions must be pinned to a commit SHA
        run: |
          set -eu
          bad=0
          while IFS= read -r line; do
            ref=$(printf '%s' "$line" | sed -E 's/^.*uses:[[:space:]]*["'"'"']?([^"'"'"' #]+).*$/\1/')
            case "$ref" in
              ./*|docker://*|actions/*|github/*) continue ;;
            esac
            if ! printf '%s' "$ref" | grep -Eq '@[0-9a-f]{40}$'; then
              echo "::error::unpinned third-party action: $ref ($line)"
              bad=1
            fi
          done < <(grep -rhoE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*.+' .github/)
          [ "$bad" -eq 0 ] || exit 1
          echo "all third-party actions are SHA-pinned"
